services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: music
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  backend:
    build: .
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/music
      PORT: 3000
      MUSIC_PROVIDER_MODE: enhanced
    ports: ["3000:3000"]
    depends_on: [postgres]
  ncm-api:
    image: binaryify/netease_cloud_music_api:latest
    expose: ["3000"]
volumes:
  pgdata:
